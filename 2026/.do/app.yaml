# DigitalOcean App Platform — static site.
# Pushing to the default branch triggers a rebuild and redeploy.
name: damienmulhall
region: fra

static_sites:
  - name: web
    github:
      repo: CHANGE-ME/damienmulhall
      branch: main
      deploy_on_push: true

    source_dir: /
    build_command: npm ci && npm run build
    output_dir: _site
    environment_slug: node-js
    envs:
      - key: NODE_ENV
        scope: BUILD_TIME
        value: production

    index_document: index.html
    error_document: 404.html
    catchall_document: 404.html

    routes:
      - path: /

ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: web

    # Fingerprinted output from eleventy-img and the font files never change.
    - match:
        path:
          prefix: /assets/img
      component:
        name: web
      cors: {}

features:
  - buildpack-stack=ubuntu-22
